[project]
name = "corl-rl-demo"
version = "0.1.0"
description = "Live online-RL demo on an SO-101 arm: press a button, get better at it, all on one laptop."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[feetech]==0.5.1",
    "pyserial>=3.5",
]

[project.scripts]
button-monitor = "corl_rl_demo.buttons:main"
rig-check = "corl_rl_demo.rig:main"
lerobot-5motor = "corl_rl_demo.five_motor:main"
rl-agent = "corl_rl_demo.agent.run:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corl_rl_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
